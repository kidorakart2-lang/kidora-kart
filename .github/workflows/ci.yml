name: CI

on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main, test]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Build-time env vars with sane defaults so no secrets are required in CI.
  NEXT_PUBLIC_API_URL: http://localhost:5000
  NEXT_PUBLIC_CDN_HOST: cdn.jewellerywalla.com
  NEXT_PUBLIC_SITE_URL: https://jewellerywalla.com
  NEXT_PUBLIC_BACKEND_URL: http://localhost:5000
  NEXT_PUBLIC_FRONTEND_URL: http://localhost:3001

jobs:
  typecheck:
    name: Typecheck (all packages)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

  build:
    name: Build (all packages)
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
